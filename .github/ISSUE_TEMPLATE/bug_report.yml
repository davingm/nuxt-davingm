name: 🐛 Bug Report
description: Laporkan bug atau perilaku tidak terduga pada create-davingm-nuxt.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah meluangkan waktu untuk melaporkan bug! 🙏
        Sebelum melanjutkan, pastikan belum ada laporan serupa di [Issues](https://github.com/davingm/nuxt-davingm/issues).

  - type: input
    id: version
    attributes:
      label: Versi create-davingm-nuxt
      description: Versi berapa yang kamu gunakan? Cek dengan `npm list create-davingm-nuxt` atau lihat di `package.json`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Deskripsi Bug
      description: Jelaskan bug secara singkat. Apa yang terjadi vs apa yang seharusnya terjadi?
      placeholder: |
        Ketika menjalankan `npx create-davingm-nuxt`, CLI crash setelah memilih template...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah untuk Mereproduksi
      description: Sebutkan langkah-langkah persis untuk memicu bug ini.
      value: |
        1. Jalankan `npx create-davingm-nuxt`
        2. Pilih template '...'
        3. Masukkan lokasi project '...'
        4. Lihat error '...'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output / Stack Trace Error
      description: Tempel output terminal atau pesan error di sini.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Informasi Environment
      value: |
        - OS: Windows / macOS / Linux
        - Node.js: v
        - Package Manager: npm / pnpm / yarn / bun (versi: )
        - Shell: bash / zsh / PowerShell / cmd
    validations:
      required: true
