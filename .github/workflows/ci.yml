name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Package & Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Package ──────────────────────────────────
      - name: Validate package.json fields
        run: |
          node --input-type=module << 'EOF'
          import pkg from './package.json' assert { type: 'json' };
          const required = ['name', 'version', 'bin', 'files', 'description'];
          const missing = required.filter(k => !pkg[k]);
          if (missing.length) {
            console.error('Missing fields:', missing.join(', '));
            process.exit(1);
          }
          console.log('✅ package.json valid');
          EOF

      - name: Check CLI entry point exists
        run: |
          [ -f src/cli.js ] && echo "✅ src/cli.js exists" || (echo "❌ src/cli.js not found" && exit 1)

      - name: Check CLI syntax
        run: node --input-type=module --check < src/cli.js

      # ── Dependencies ─────────────────────────────
      - name: Verify dependencies resolve
        run: |
          node --input-type=module << 'EOF'
          import { createRequire } from 'module';
          const require = createRequire(import.meta.url);
          const deps = ['@clack/prompts', 'picocolors', 'which'];
          let fail = false;
          for (const dep of deps) {
            try { require(dep); console.log(`✅ ${dep}`); }
            catch (e) { console.error(`❌ ${dep}:`, e.message); fail = true; }
          }
          if (fail) process.exit(1);
          EOF

      # ── Templates ────────────────────────────────
      - name: Check templates directory
        run: |
          [ -d templates ] && echo "✅ templates/ exists" || (echo "❌ templates/ not found" && exit 1)

      - name: Validate templates structure
        run: |
          node --input-type=module << 'EOF'
          import { readdirSync, existsSync, readFileSync } from 'fs';
          import { join } from 'path';

          const dir = './templates';
          const required = ['package.json', 'nuxt.config.ts'];
          const presets = readdirSync(dir, { withFileTypes: true })
            .filter(e => e.isDirectory()).map(e => e.name);

          if (!presets.length) { console.error('❌ No presets found'); process.exit(1); }
          console.log(`📦 Presets: ${presets.join(', ')}`);

          let fail = false;
          for (const preset of presets) {
            for (const file of required) {
              const p = join(dir, preset, file);
              if (!existsSync(p)) { console.error(`❌ Missing ${preset}/${file}`); fail = true; }
              else if (file === 'package.json') {
                try { JSON.parse(readFileSync(p, 'utf-8')); console.log(`✅ ${preset}/${file}`); }
                catch (e) { console.error(`❌ ${preset}/${file} invalid JSON`); fail = true; }
              } else { console.log(`✅ ${preset}/${file}`); }
            }
          }
          if (fail) process.exit(1);
          console.log('\n✅ All templates valid');
          EOF
